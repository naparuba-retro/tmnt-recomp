name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# No ROM is available here (and none must be put here): the jobs build the game, check the formatting and run the tests that need no ROM
# (tools/smoke_test.sh). The replays against the references (tools/ref_run_check.sh) are run locally.
# Each build is packaged: tmnt-<version>-windows-x64.zip (tmnt.exe) and tmnt-<version>-linux-x86_64.tar.gz (tmnt, executable). They are kept as workflow
# artifacts and, when a tag "v*" is pushed (git tag v1.0.0 && git push origin v1.0.0), attached to a GitHub release. <version> is the tag without its "v",
# or "dev-<commit>" for a build that is not a release.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format (the version the code is formatted with)
        run: python3 -m pip install clang-format==19.1.5
      - name: Check the formatting (bash tools/format_c.sh to fix)
        run: bash tools/format_c.sh --check

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-dev pkg-config xvfb
      - name: Build (gcc, SDL2)
        run: python3 build.py
      - name: Tests that need no ROM
        run: bash tools/smoke_test.sh build
      - name: Package (tar.gz, tmnt is executable)
        run: |
          VERSION=dev-${GITHUB_SHA::7}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; fi
          NAME=tmnt-$VERSION-linux-x86_64
          mkdir -p package/$NAME
          cp build/tmnt README.md LICENSE package/$NAME/
          mkdir package/$NAME/data
          cp data/spawn_mask.txt package/$NAME/data/
          chmod a+x package/$NAME/tmnt
          mkdir package/$NAME/rom
          echo "Put your Teenage Mutant Ninja Turtles ROM (.nes file, European or American version) in this folder." > package/$NAME/rom/PUT_YOUR_ROM_HERE.txt
          tar -czf $NAME.tar.gz -C package $NAME
      - uses: actions/upload-artifact@v7
        with:
          name: tmnt-linux-x86_64
          path: tmnt-*-linux-x86_64.tar.gz
          compression-level: 0
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (MSVC)
        shell: bash
        run: python build.py
      - name: Tests that need no ROM
        shell: bash
        run: bash tools/smoke_test.sh build
      - name: Package (zip)
        shell: pwsh
        run: |
          $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF -like "refs/tags/v*") { $version = $env:GITHUB_REF_NAME.Substring(1) }
          $name = "tmnt-$version-windows-x64"
          New-Item -ItemType Directory -Path "package/$name" | Out-Null
          Copy-Item build/tmnt.exe, README.md, LICENSE "package/$name/"
          New-Item -ItemType Directory -Path "package/$name/data" | Out-Null
          Copy-Item data/spawn_mask.txt "package/$name/data/"
          New-Item -ItemType Directory -Path "package/$name/rom" | Out-Null
          Set-Content -Path "package/$name/rom/PUT_YOUR_ROM_HERE.txt" -Value "Put your Teenage Mutant Ninja Turtles ROM (.nes file, European or American version) in this folder."
          Compress-Archive -Path "package/$name" -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: tmnt-windows-x64
          path: tmnt-*-windows-x64.zip
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/tmnt-*-windows-x64.zip
            packages/tmnt-*-linux-x86_64.tar.gz
          generate_release_notes: true
